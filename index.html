<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>九九 VOCA</title><style>:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#17324b;background:#f6f9ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(26px,5vw,42px);margin:12px 0}p{margin:5px 0 14px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 18px}.stage{border:2px solid #9bb5d2;background:white;border-radius:15px;font-size:clamp(17px,3vw,24px);padding:12px 3px;font-weight:800;color:#17324b}.stage[aria-pressed=true]{background:#155fbd;color:white;border-color:#155fbd}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{min-height:clamp(110px,21vh,190px);border:3px solid #bdd5ef;border-radius:20px;background:#fff;box-shadow:0 5px 0 #d9e4f3;color:#14334f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}.tile.playing{background:#ffe28a;border-color:#f09a19;box-shadow:0 0 0 5px #ffcf5b,0 5px 0 #e2b45a;transform:scale(1.025)}.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #d9e4f3}.expr{font-size:clamp(23px,5vw,40px);font-weight:850}.answer{font-size:clamp(30px,7vw,58px);color:#1262ba;font-weight:900}.reading{font-size:clamp(12px,2.3vw,20px)}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.controls label{font-size:17px}.controls button{border:1px solid #9bb5d2;background:white;border-radius:12px;padding:9px 14px;font-weight:700}.playall{width:100%;background:#16804a;color:white;border:0;border-radius:17px;padding:16px;font-size:clamp(21px,4vw,29px);font-weight:850;margin:4px 0 12px;touch-action:manipulation}.playall:disabled{opacity:.65}.foot{color:#4b6075;font-size:13px;margin-top:16px}@media(max-width:500px){.wrap{padding:10px}.grid{gap:7px}.tile{border-radius:14px;min-height:105px}.reading{font-size:12px}.stages{gap:5px}.stage{padding:10px 1px}}</style></head><body><main class="wrap"><header><h1>🎵 九九 VOCA</h1><button id="stop" style="padding:10px;border-radius:12px">■ とめる</button></header><p>だんを えらんで、ボタンを おしてね！</p><nav class="stages" id="stages" aria-label="九九の段"></nav><div class="controls"><label><input type="checkbox" id="showAnswers" checked> こたえを みせる</label><label><input type="checkbox" id="readFull" checked> しきと こたえを よむ</label></div><button class="playall" id="playall">▶ ぜんぶ よむ（１〜９）</button><section class="grid" id="grid" aria-label="九九のボタン"></section><p class="foot">※ iPhone・iPadのSafariでは、音量を上げてからボタンを押してください。音声は端末の日本語読み上げ機能を使います。</p></main><script>const readings={2:['にいちが に','ににんが し','にさんが ろく','にしが はち','にご じゅう','にろく じゅうに','にしち じゅうし','にはち じゅうろく','にく じゅうはち'],3:['さんいちが さん','さにが ろく','さざんが く','さんし じゅうに','さんご じゅうご','さぶろく じゅうはち','さんしち にじゅういち','さんぱ にじゅうし','さんく にじゅうしち'],4:['しいちが し','しにが はち','しさん じゅうに','しし じゅうろく','しご にじゅう','しろく にじゅうし','ししち にじゅうはち','しは さんじゅうに','しく さんじゅうろく'],5:['ごいちが ご','ごに じゅう','ごさん じゅうご','ごし にじゅう','ごご にじゅうご','ごろく さんじゅう','ごしち さんじゅうご','ごは しじゅう','ごく しじゅうご'],6:['ろくいちが ろく','ろくに じゅうに','ろくさん じゅうはち','ろくし にじゅうし','ろくご さんじゅう','ろくろく さんじゅうろく','ろくしち しじゅうに','ろくは しじゅうはち','ろっく ごじゅうし'],7:['しちいちが しち','しちに じゅうし','しちさん にじゅういち','しちし にじゅうはち','しちご さんじゅうご','しちろく しじゅうに','しちしち しじゅうく','しちは ごじゅうろく','しちく ろくじゅうさん'],8:['はちいちが はち','はちに じゅうろく','はっさん にじゅうし','はっし さんじゅうに','はちご しじゅう','はちろく しじゅうはち','はっしち ごじゅうろく','はっぱ ろくじゅうし','はっく しちじゅうに'],9:['くいちが く','くに じゅうはち','くさん にじゅうしち','くし さんじゅうろく','くご しじゅうご','くろく ごじゅうし','くしち ろくじゅうさん','くは しちじゅうに','くく はちじゅういち']};let stage=2;
const nav=document.getElementById('stages'),grid=document.getElementById('grid'),show=document.getElementById('showAnswers'),full=document.getElementById('readFull'),playall=document.getElementById('playall');
let runId=0,playing=false,activeIndex=-1;
function stopSpeech(){runId++;playing=false;activeIndex=-1;if('speechSynthesis' in window)window.speechSynthesis.cancel();updateHighlight()}
function updateHighlight(){Array.from(grid.children).forEach((b,i)=>b.classList.toggle('playing',i===activeIndex));playall.textContent=playing?'■ ぜんぶ よむのを とめる':'▶ ぜんぶ よむ（１〜９）';playall.setAttribute('aria-pressed',String(playing))}
function utter(text,onEnd){if(!('speechSynthesis' in window)){alert('この端末では音声読み上げを利用できません');stopSpeech();return}const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.78;u.pitch=1;const v=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;u.onend=onEnd;u.onerror=onEnd;window.speechSynthesis.speak(u)}
function speakOne(i){stopSpeech();const id=runId;activeIndex=i;updateHighlight();utter(full.checked?readings[stage][i]:String(stage*(i+1)),()=>{if(id!==runId)return;activeIndex=-1;updateHighlight()})}
function playSequence(){if(playing){stopSpeech();return}stopSpeech();playing=true;const id=runId;let i=0;function next(){if(id!==runId)return;if(i>=9){playing=false;activeIndex=-1;updateHighlight();return}activeIndex=i;updateHighlight();const text=full.checked?readings[stage][i]:String(stage*(i+1));i++;utter(text,next)}next()}
function render(){nav.innerHTML='';for(let n=2;n<=9;n++){const b=document.createElement('button');b.className='stage';b.textContent=n+'のだん';b.setAttribute('aria-pressed',String(n===stage));b.onclick=()=>{stopSpeech();stage=n;render()};nav.append(b)}grid.innerHTML='';for(let n=1;n<=9;n++){const b=document.createElement('button');b.className='tile';const r=readings[stage][n-1],answer=stage*n;b.innerHTML='<span class="expr">'+stage+' × '+n+'</span>'+(show.checked?'<span class="answer">'+answer+'</span>':'')+'<span class="reading">'+r+'</span>';b.setAttribute('aria-label',stage+'かける'+n+'、'+answer);b.onclick=()=>speakOne(n-1);grid.append(b)}updateHighlight()}
show.onchange=render;full.onchange=()=>{if(playing)stopSpeech()};playall.onclick=playSequence;document.getElementById('stop').onclick=stopSpeech;document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech()});render();
</script></body></html>
